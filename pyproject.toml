[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-traversability"
version = "0.1.0"
description = "Capability-aware traversability offline training and feature extraction"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<1.4",
  "numpy>=1.24",
  "torch>=2.11,<2.12",
  "lightning>=2.5,<2.7",
  "torchvision>=0.26,<0.27",
  "timm>=1.0.20",
  "transformers>=4.40",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "Pillow>=10",
  "PyYAML>=6",
  "tqdm>=4.65",
  "wandb>=0.16",
  "matplotlib>=3.8",
]

# Select the accelerator explicitly. uv locks both alternatives together.
[project.optional-dependencies]
cpu = ["torch>=2.1", "torchvision>=0.16"]
cu128 = ["torch>=2.1", "torchvision>=0.16"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["cat/src"]
include = ["cat*"]

[tool.setuptools]
include-package-data = true
